    <script>
      // Global fallback in capture phase to guarantee images never break on any host
      window.addEventListener('error', function(e) {
        var el = e.target;
        if (el && el.tagName === 'IMG') {
          var src = el.getAttribute('src');
          if (src && !src.startsWith('http') && !src.startsWith('data:') && !el.dataset.fallbackTried) {
            el.dataset.fallbackTried = 'true';
            var normalized = src.startsWith('/') ? src : '/' + src;
            el.src = 'https://american-book-founderszip--devwork65.replit.app' + normalized;
          }
        }
      }, true);
    </script>
